<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArewaSafe — Tactical Travel-Safety Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Daylight Harmattan sand paper, indigo cloth ink, laterite red */
  --bg: #f4efe4;
  --panel: #fffcf6;
  --card: #f0e9d9;
  --card-hover: #e8dfca;
  --line: #d8cfba;
  --ink: #232d4b;
  --dim: #5f6a84;
  --on-fill: #ffffff;
  --alert: #b5301a;
  --amber: #9a5a00;
  --ok: #177a4b;
  --trip: #2b4ba0;
  --notice-bg: #1c2a56;
  --notice-ink: #f4ecd8;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}

/* Dark Projector Theme */
body[data-theme="dark"] {
  --bg: #0a1022;
  --panel: rgba(16, 26, 51, 0.94);
  --card: #17244a;
  --card-hover: #223463;
  --line: #2f4378;
  --ink: #efe6d2;
  --dim: #b7b3a8;
  --on-fill: #0a1022;
  --alert: #ff5a36;
  --amber: #f5b83d;
  --ok: #52c98c;
  --trip: #63d2e6;
  --notice-bg: #efe6d2;
  --notice-ink: #0a1022;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.45 var(--body);
  overflow: hidden;
  transition: background 0.25s ease, color 0.25s ease;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

#map { position: fixed; inset: 0; background: var(--bg); }
.leaflet-container { font-family: var(--body); }
.leaflet-control-attribution { background: rgba(255,252,246,.85) !important; color: var(--dim) !important; font-size: 11px; }
body[data-theme="dark"] .leaflet-control-attribution { background: rgba(10,16,34,.85) !important; color: var(--dim) !important; }
.leaflet-control-attribution a { color: var(--dim) !important; }
@media (min-width: 961px) { .leaflet-bottom.leaflet-left { left: 356px; } }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--line); }
.leaflet-bar a:hover { background: var(--card); }

/* Invert map tiles gracefully when dark theme is active */
body[data-theme="dark"] .leaflet-tile-pane {
  filter: brightness(0.65) invert(1) contrast(2.8) hue-rotate(205deg) saturate(0.35) brightness(0.75);
}

/* Floating Panels */
.panel {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  transition: background 0.25s ease, border-color 0.25s ease;
}

/* Top Masthead */
#mast {
  top: 16px; left: 16px;
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px;
  border-radius: 12px;
}
#mast h1 {
  margin: 0;
  font: 800 24px/1 var(--display);
  font-stretch: 118%;
  letter-spacing: -.01em;
}
.live { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; }
.live i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(23,122,75,.7); animation: beat 2s infinite; }
.live.off i { background: var(--amber); animation: none; }
.live.off { color: var(--amber); }
@keyframes beat { 70% { box-shadow: 0 0 0 8px rgba(23,122,75,0); } 100% { box-shadow: 0 0 0 0 rgba(23,122,75,0); } }

/* Masthead Actions & Badges */
.nav-actions { display: flex; align-items: center; gap: 8px; margin-left: 6px; }
.pill-btn {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
}
.pill-btn:hover { background: var(--card-hover); transform: translateY(-1px); }

/* Left Ledger */
#ledger {
  top: 78px; left: 16px; bottom: 16px; width: 340px;
  border-radius: 14px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
#ledger h2 {
  margin: 0; padding: 14px 16px 4px;
  font: 700 19px/1.2 var(--display); font-stretch: 112%;
}
.sub { margin: 0; padding: 0 16px 8px; color: var(--dim); font-size: 14px; }
#ledger-scroll { overflow-y: auto; padding: 4px 12px 14px; flex: 1; }
.group-title { margin: 12px 4px 6px; font: 700 15px var(--display); font-stretch: 110%; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }

.card {
  display: block; width: 100%; text-align: left;
  background: var(--card);
  border: 1px solid transparent;
  border-left: 7px solid var(--dim);
  border-radius: 8px;
  padding: 10px 12px;
  margin: 0 0 8px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.card:hover { background: var(--card-hover); }
.card[aria-current="true"] { border-color: var(--ink); border-left-color: var(--c, var(--dim)); background: var(--card-hover); }
.card .t { font: 700 17px/1.25 var(--display); font-stretch: 105%; }
.card .m { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; font-size: 14px; color: var(--dim); }
.card .st { font-weight: 700; color: var(--c); }
.s-analyzing { --c: var(--trip); }
.s-pending   { --c: var(--amber); }
.s-confirmed { --c: var(--alert); }
.s-sent      { --c: var(--ok); }
.card { border-left-color: var(--c, var(--dim)); }

.trip { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin: 0 0 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
.trip b { font-family: var(--display); font-stretch: 105%; }
.trip .tag { font-weight: 700; color: var(--alert); }
.trip .age { color: var(--dim); font-size: 13px; }
.empty { margin: 8px 6px; color: var(--dim); font-size: 14px; }

/* Right Sheet */
#sheet {
  top: 16px; right: 16px; bottom: 16px; width: 460px;
  border-radius: 14px;
  display: none; flex-direction: column;
  overflow: hidden;
}
#sheet.open { display: flex; animation: slide .28s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slide { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 8px; }
.sheet-type { font: 800 24px/1.1 var(--display); font-stretch: 112%; }
.sheet-meta { margin-top: 4px; color: var(--dim); font-size: 15px; }
.x { background: var(--card); border: 1px solid var(--line); border-radius: 8px; width: 38px; height: 38px; font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.x:hover { background: var(--card-hover); }
.sheet-body { overflow-y: auto; padding: 4px 18px 12px; flex: 1; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 99px; font-weight: 700; font-size: 15px; color: var(--on-fill); background: var(--c, var(--dim)); margin: 4px 0 6px; }
.sheet-body h3 { margin: 16px 0 6px; font: 700 17px var(--display); font-stretch: 108%; }
.sheet-body p { margin: 0; }

.dir { margin: 0 0 10px; }
.dir .row { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
.bar { height: 10px; background: var(--card); border-radius: 6px; margin: 4px 0; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--amber); border-radius: 6px; transition: width 0.4s ease; }
.dir small { color: var(--dim); font-size: 14px; }

/* The Community Warning Notice Box */
.notice {
  margin: 18px 0 6px;
  background: var(--notice-bg);
  color: var(--notice-ink);
  border-radius: 10px;
  padding: 16px 18px 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
}
.notice .lead { font: 700 14px var(--display); font-stretch: 110%; opacity: 0.8; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.notice .ha { font: 800 25px/1.2 var(--display); font-stretch: 104%; margin: 0; }
.notice hr { border: 0; border-top: 1.5px solid rgba(120,120,120,0.3); margin: 12px 0 10px; }
.notice .en { margin: 0; font-size: 16px; }

.checks { list-style: none; margin: 0; padding: 0; }
.checks li { margin: 0 0 6px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.checks input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ok); }

.src { margin: 14px 0 0; color: var(--dim); font-size: 13px; }

.foot { padding: 14px 18px; border-top: 1px solid var(--line); background: rgba(0,0,0,0.03); }
body[data-theme="dark"] .foot { background: rgba(0,0,0,0.25); }
.btn {
  display: block; width: 100%;
  background: var(--alert); color: var(--on-fill);
  border: 0; border-radius: 10px;
  padding: 14px 18px;
  font: 800 19px/1.2 var(--display); font-stretch: 108%;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
.btn:disabled { background: var(--card-hover); color: var(--dim); cursor: default; }
.foot small { display: block; margin-top: 6px; color: var(--dim); font-size: 14px; text-align: center; }
.sent { display: flex; gap: 12px; align-items: flex-start; }
.sent .tick { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ok); color: var(--on-fill); display: grid; place-items: center; font-size: 20px; font-weight: 800; }
.sent b { font: 800 19px var(--display); font-stretch: 108%; display: block; }
.sent span { color: var(--dim); font-size: 15px; }

.skeleton { height: 14px; border-radius: 6px; margin: 0 0 8px; background: linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Toast */
#toast {
  position: fixed; left: 50%; top: 16px; transform: translate(-50%, -220%);
  z-index: 2000;
  background: var(--ok); color: var(--on-fill);
  font: 800 18px var(--display); font-stretch: 108%;
  padding: 12px 22px; border-radius: 10px;
  transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: calc(100vw - 32px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}
#toast.show { transform: translate(-50%, 0); }

/* Quick Demo Trigger Dock (Bottom-Right) */
#demo-dock {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 1001;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 6px 24px rgba(0,0,0,0.15);
}
#demo-dock.collapsed .dock-content { display: none; }
.dock-title { font-weight: 800; font-size: 13px; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); }
.demo-btn {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.demo-btn:hover { background: var(--card-hover); transform: translateY(-1px); }
.demo-btn.active { background: var(--amber); color: #fff; }

/* Map Markers & Animations */
.inc-icon { background: none; border: 0; }
.inc-icon .core { position: absolute; left: 7px; top: 7px; width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 3px solid var(--bg); }
.inc-icon .pulse { position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--c); opacity: .5; animation: ping 1.8s ease-out infinite; }
.inc-icon.s-sent .pulse { animation: none; opacity: .25; }
@keyframes ping { to { transform: scale(2.6); opacity: 0; } }

@media (max-width: 960px) {
  #ledger { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 34vh; border-radius: 14px 14px 0 0; }
  #sheet { top: auto; bottom: 0; left: 0; right: 0; width: auto; height: 78vh; border-radius: 14px 14px 0 0; }
  #mast { left: 8px; top: 8px; gap: 10px; padding: 6px 12px; }
  #mast h1 { font-size: 20px; }
  #demo-dock { bottom: 36vh; right: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of trips and incidents"></div>

<header id="mast" class="panel">
  <h1>ArewaSafe</h1>
  <span id="live" class="live off" role="status"><i></i><span>Connecting</span></span>

  <div class="nav-actions">
    <!-- Sound Chime Toggle -->
    <button id="sound-toggle" class="pill-btn" title="Toggle audio alert chime">
      <span id="sound-icon">🔊</span>
    </button>
    <!-- Daylight / Night Projector Theme Toggle -->
    <button id="theme-toggle" class="pill-btn" title="Toggle dark projector theme">
      <span id="theme-icon">🌙</span> <span id="theme-label">Night</span>
    </button>
  </div>
</header>

<aside id="ledger" class="panel" aria-label="Trips and incidents">
  <h2 id="counts">Waiting for trips</h2>
  <p class="sub" id="counts-sub">Phones report in while a trip is running.</p>
  <div id="ledger-scroll"></div>
</aside>

<section id="sheet" class="panel" aria-label="Incident report"></section>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Quick Demo Simulation Dock -->
<div id="demo-dock" class="panel">
  <span class="dock-title">Live Simulator:</span>
  <button class="demo-btn" id="btn-demo-dev" onclick="runSim('deviation')">⚡ Bush Deviation</button>
  <button class="demo-btn" id="btn-demo-man" onclick="runSim('manual')">🚨 Silent 911=</button>
  <button class="demo-btn" id="btn-demo-dead" onclick="runSim('deadman')">⏱️ Dead-Man</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const BASE = new URLSearchParams(location.search).get('server') || '';
  const RADIUS_KM = 5;

  const TYPES = {
    MANUAL: 'Silent alarm from the phone',
    DEAD_MAN: 'Phone stopped reporting',
    BUSH_DEVIATION: 'Vehicle left the highway',
  };
  const STATUS = {
    ANALYZING: { label: 'Writing report', cls: 's-analyzing' },
    PENDING_CONFIRM: { label: 'Waiting for your OK', cls: 's-pending' },
    CONFIRMED: { label: 'Sending warning', cls: 's-confirmed' },
    BROADCAST: { label: 'Warning sent', cls: 's-sent' },
  };
  const COLORS = { 's-analyzing': '#2b4ba0', 's-pending': '#e09100', 's-confirmed': '#b5301a', 's-sent': '#177a4b' };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  function ago(ts) {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 5) return 'just now';
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.round(s / 60)} min ago`;
    return `${Math.round(s / 3600)} h ago`;
  }

  /* ---------- Audio Dispatch Chime (Web Audio API) ---------- */
  let audioCtx = null;
  let soundEnabled = true;

  function playAlertSound(type = 'alert') {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';

      if (type === 'broadcast') {
        // High ascending affirmative chime
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      } else {
        // Tactical dual-tone alert chime
        osc.frequency.setValueAtTime(440, now); // A4
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12); // E5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    } catch (_) {}
  }

  $('sound-toggle').onclick = () => {
    soundEnabled = !soundEnabled;
    $('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
    toast(soundEnabled ? 'Alert chime enabled' : 'Alert chime muted');
  };

  /* ---------- Theme Switcher ---------- */
  const savedTheme = localStorage.getItem('arewasafe_theme') || 'light';
  if (savedTheme === 'dark') applyTheme('dark');

  function applyTheme(th) {
    document.body.setAttribute('data-theme', th);
    $('theme-icon').textContent = th === 'dark' ? '☀️' : '🌙';
    $('theme-label').textContent = th === 'dark' ? 'Daylight' : 'Night';
    localStorage.setItem('arewasafe_theme', th);
  }

  $('theme-toggle').onclick = () => {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    applyTheme(isDark ? 'light' : 'dark');
  };

  /* ---------- Map Setup (OpenStreetMap, Zero API Keys) ---------- */
  const map = L.map('map', { zoomControl: false }).setView([10.8, 7.57], 9);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);

  // Kaduna–Zaria Highway Corridor Reference Polyline
  const CORRIDOR = [
    [10.5105, 7.4165], // Kaduna
    [10.8, 7.57],      // Midpoint
    [11.0855, 7.7199]  // Zaria
  ];
  L.polyline(CORRIDOR, {
    color: '#2b4ba0',
    weight: 3,
    dashArray: '6, 8',
    opacity: 0.5
  }).addTo(map).bindTooltip("Kaduna–Zaria Highway Corridor", { sticky: true });

  const trips = new Map();      // id -> {points, line, dot, last, speed, ended}
  const incidents = new Map();  // id -> incident
  const markers = new Map();    // incident id -> L.marker
  let selected = null;
  let ring = null;
  let lastBroadcast = null;

  function ensureTrip(id) {
    let t = trips.get(id);
    if (t) return t;
    t = { id, points: [], last: null, speed: null, ended: false,
      line: L.polyline([], { color: '#2b4ba0', weight: 5, opacity: 0.9 }).addTo(map),
      dot: L.circleMarker([0, 0], { radius: 9, color: '#ffffff', weight: 3, fillColor: '#2b4ba0', fillOpacity: 1 }) };
    trips.set(id, t);
    fetch(`${BASE}/trips/${id}/track`).then((r) => r.json()).then((rows) => {
      const back = rows.map((p) => [p.lat, p.lng]);
      t.points = back.concat(t.points.slice(Math.max(0, t.points.length - 1)));
      if (rows.length) { const l = rows[rows.length - 1]; t.last = t.last || l.ts; t.speed = t.speed ?? l.speed; }
      drawTrip(t); renderLedger();
    }).catch(() => {});
    return t;
  }

  function drawTrip(t) {
    t.line.setLatLngs(t.points);
    if (t.points.length) {
      t.dot.setLatLng(t.points[t.points.length - 1]);
      if (!t.ended && !map.hasLayer(t.dot)) t.dot.addTo(map);
    }
    if (t.ended) { t.line.setStyle({ opacity: 0.3 }); map.removeLayer(t.dot); }
  }

  function markerIcon(status) {
    const cls = (STATUS[status] || STATUS.ANALYZING).cls;
    return L.divIcon({ className: `inc-icon ${cls}`, iconSize: [32, 32], iconAnchor: [16, 16],
      html: `<span class="pulse" style="--c:${COLORS[cls]}"></span><span class="core" style="--c:${COLORS[cls]}"></span>` });
  }

  function ensureMarker(inc) {
    if (inc.lat == null || inc.lng == null) return;
    let m = markers.get(inc.id);
    if (!m) {
      m = L.marker([inc.lat, inc.lng], { icon: markerIcon(inc.status), keyboard: false }).addTo(map);
      m.on('click', () => select(inc.id));
      markers.set(inc.id, m);
    } else {
      m.setIcon(markerIcon(inc.status));
    }
  }

  function select(id, fly = true) {
    selected = id;
    const inc = incidents.get(id);
    if (ring) { map.removeLayer(ring); ring = null; }
    if (inc && inc.lat != null) {
      ring = L.circle([inc.lat, inc.lng], { radius: RADIUS_KM * 1000, color: '#b5301a', weight: 2, dashArray: '8 8', fillColor: '#b5301a', fillOpacity: 0.08 }).addTo(map);
      if (fly) {
        const wide = window.innerWidth > 960;
        map.flyToBounds(ring.getBounds(), { paddingTopLeft: [wide ? 380 : 20, 90], paddingBottomRight: [wide ? 480 : 20, wide ? 30 : window.innerHeight * 0.55], duration: 0.8 });
      }
    }
    renderLedger(); renderSheet();
  }

  /* ---------- Data Synchronization ---------- */
  function mergeIncident(d, isNew) {
    const prev = incidents.get(d.id);
    const inc = Object.assign(prev || { created_at: Date.now() }, {
      id: d.id,
      tripId: d.tripId ?? d.trip_id ?? (prev && prev.tripId),
      type: d.type, status: d.status, lat: d.lat, lng: d.lng,
    });
    if (d.created_at) inc.created_at = d.created_at;
    if (d.sitrep) inc.sitrep = d.sitrep;
    if (d.status === 'BROADCAST' && lastBroadcast) inc.broadcast = lastBroadcast;
    incidents.set(inc.id, inc);
    if (inc.tripId != null) ensureTrip(inc.tripId);
    ensureMarker(inc);

    if (isNew && !prev) {
      playAlertSound('alert');
      select(inc.id);
    } else {
      renderLedger();
      if (selected === inc.id) renderSheet();
    }
  }

  function onPing(p) {
    const t = ensureTrip(p.tripId);
    t.points.push([p.lat, p.lng]);
    t.last = p.ts; t.speed = p.speed; t.ended = false;
    drawTrip(t);
    renderLedgerSoon();
  }

  function onTrip(d) {
    const t = ensureTrip(d.id);
    t.ended = d.status === 'ENDED';
    drawTrip(t); renderLedger();
  }

  /* ---------- Ledger ---------- */
  let ledgerTimer = null;
  function renderLedgerSoon() { if (!ledgerTimer) ledgerTimer = setTimeout(() => { ledgerTimer = null; renderLedger(); }, 600); }

  function renderLedger() {
    const list = [...incidents.values()].sort((a, b) => b.id - a.id);
    const active = [...trips.values()].filter((t) => !t.ended && t.points.length);
    const alertTrips = new Set(list.map((i) => i.tripId));

    $('counts').textContent = list.length ? plural(list.length, 'incident', 'incidents') : (active.length ? plural(active.length, 'trip', 'trips') + ' on the road' : 'Waiting for trips');
    $('counts-sub').textContent = list.length
      ? `${plural(active.length, 'trip', 'trips')} still reporting in.`
      : (active.length ? 'No incidents so far.' : 'Phones report in while a trip is running.');

    let html = '';
    html += '<div class="group-title">Incidents</div>';
    html += list.length ? list.map((i) => {
      const st = STATUS[i.status] || STATUS.ANALYZING;
      return `<button class="card ${st.cls}" data-inc="${i.id}" aria-current="${selected === i.id}">
        <div class="t">${esc(TYPES[i.type] || i.type)}</div>
        <div class="m"><span class="st">${st.label}</span><span>Trip ${esc(i.tripId)}, ${ago(i.created_at)}</span></div>
      </button>`;
    }).join('') : '<p class="empty">Nothing to review.</p>';

    html += '<div class="group-title">On the road</div>';
    html += active.length ? active.map((t) => `
      <div class="trip"><span><b>Trip ${esc(t.id)}</b>${t.speed != null ? `, ${Math.round(t.speed)} km/h` : ''}</span>
      ${alertTrips.has(t.id) ? '<span class="tag">Alert</span>' : `<span class="age">${t.last ? ago(t.last) : ''}</span>`}</div>`).join('')
      : '<p class="empty">No trips reporting right now.</p>';

    const sc = $('ledger-scroll');
    const top = sc.scrollTop;
    sc.innerHTML = html;
    sc.scrollTop = top;
  }

  $('ledger-scroll').addEventListener('click', (e) => {
    const b = e.target.closest('[data-inc]');
    if (b) select(Number(b.dataset.inc));
  });

  /* ---------- Sheet ---------- */
  function renderSheet() {
    const sheet = $('sheet');
    const inc = incidents.get(selected);
    if (!inc) { sheet.classList.remove('open'); sheet.innerHTML = ''; return; }
    const st = STATUS[inc.status] || STATUS.ANALYZING;
    const s = inc.sitrep;
    const keep = [...sheet.querySelectorAll('.checks input')].map((c) => c.checked);

    let body = '';
    if (!s) {
      body = `<h3>What happened</h3><div class="skeleton" style="width:95%"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:88%"></div>
              <p class="src">Gemma 4 is turning the phone's location data into a situation report.</p>`;
    } else {
      const dirs = (s.likely_directions || []).map((d) => {
        const pct = Math.round(Math.max(0, Math.min(1, Number(d.confidence) || 0)) * 100);
        return `<div class="dir"><div class="row"><span>${esc(d.direction)}</span><span>${pct}%</span></div>
          <div class="bar"><span style="width:${pct}%"></span></div><small>${esc(d.reason)}</small></div>`;
      }).join('');
      const acts = (s.recommended_actions || []).map((a, i) => `<li><label><input type="checkbox" ${keep[i] ? 'checked' : ''}><span>${esc(a)}</span></label></li>`).join('');
      const fallback = !s.source || s.source === 'fallback';
      body = `
        <h3>What happened</h3><p>${esc(s.sitrep)}</p>
        ${dirs ? `<h3>Where they may be heading</h3>${dirs}<small class="src" style="display:block;margin:0">These are possibilities for responders to check, not predictions.</small>` : ''}
        <section class="notice" aria-label="Warning for people nearby">
          <p class="lead">Warning for people within ${RADIUS_KM} km</p>
          <p class="ha" lang="ha">${esc(s.hausa_warning)}</p>
          <hr><p class="en">${esc(s.english_warning)}</p>
        </section>
        ${acts ? `<h3>Responders should</h3><ul class="checks">${acts}</ul>` : ''}
        <p class="src">${fallback ? 'Report from the built-in template. No AI model is connected.' : `Report written by ${esc(s.source)}.`}</p>`;
    }

    let foot;
    if (inc.status === 'BROADCAST') {
      const b = inc.broadcast;
      foot = `<div class="sent"><div class="tick" aria-hidden="true">&#10003;</div><div><b>Warning sent</b>
        <span>${b ? (b.sent ? `Reached ${plural(b.sent, 'person', 'people')} within ${RADIUS_KM} km.` : `No registered contacts are inside the ${RADIUS_KM} km area.`) : `Sent to people within ${RADIUS_KM} km.`}</span></div></div>`;
    } else if (inc.status === 'PENDING_CONFIRM') {
      foot = `<button class="btn" id="confirm">Send warning to people within ${RADIUS_KM} km</button>
        <small>Nothing goes out until you press this.</small>`;
    } else if (inc.status === 'CONFIRMED') {
      foot = `<button class="btn" disabled>Sending warning</button>`;
    } else {
      foot = `<button class="btn" disabled>Waiting for the report</button>`;
    }

    sheet.innerHTML = `
      <div class="sheet-head"><div><div class="sheet-type">${esc(TYPES[inc.type] || inc.type)}</div>
        <div class="sheet-meta">Trip ${esc(inc.tripId)}, ${ago(inc.created_at)}</div></div>
        <button class="x" id="close" aria-label="Close report">&times;</button></div>
      <div class="sheet-body"><span class="badge ${st.cls}">${st.label}</span>${body}</div>
      <div class="foot">${foot}</div>`;
    sheet.classList.add('open');

    $('close').onclick = () => { selected = null; if (ring) { map.removeLayer(ring); ring = null; } renderSheet(); renderLedger(); };
    const c = $('confirm');
    if (c) c.onclick = async () => {
      c.disabled = true; c.textContent = 'Sending warning';
      try {
        const r = await fetch(`${BASE}/incidents/${inc.id}/confirm`, { method: 'POST' });
        if (!r.ok) throw new Error();
      } catch (e) {
        c.disabled = false; c.textContent = `Send warning to people within ${RADIUS_KM} km`;
        toast('Could not send. Check the server and try again.', true);
      }
    };
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected !== null) $('close') && $('close').click(); });

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg;
    t.style.background = bad ? 'var(--alert)' : '';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 6000);
  }

  /* ---------- Live Link (SSE) ---------- */
  function setLive(on) {
    const el = $('live');
    el.classList.toggle('off', !on);
    el.lastElementChild.textContent = on ? 'Live' : 'Reconnecting';
  }

  function connect() {
    const es = new EventSource(`${BASE}/stream`);
    es.onopen = () => setLive(true);
    es.onerror = () => setLive(false);
    es.addEventListener('ping', (e) => onPing(JSON.parse(e.data)));
    es.addEventListener('trip', (e) => onTrip(JSON.parse(e.data)));
    es.addEventListener('incident', (e) => mergeIncident(JSON.parse(e.data), true));
    es.addEventListener('incident:update', (e) => mergeIncident(JSON.parse(e.data), false));
    es.addEventListener('broadcast', (e) => {
      lastBroadcast = JSON.parse(e.data);
      playAlertSound('broadcast');
      toast(lastBroadcast.sent ? `Warning sent to ${plural(lastBroadcast.sent, 'person', 'people')} within ${RADIUS_KM} km` : `No registered contacts inside the ${RADIUS_KM} km area`);
    });
  }

  /* ---------- In-Browser Simulation Runner ---------- */
  window.runSim = async function (scenario) {
    toast(`Running ${scenario.toUpperCase()} simulation...`);
    try {
      const res = await fetch(`${BASE}/trips/start`, { method: 'POST' });
      if (!res.ok) throw new Error('Failed to start trip');
      const { tripId } = await res.json();

      let lat = 10.5105, lng = 7.4165, heading = 28, speed = 80;

      // 4 highway heartbeats
      for (let i = 0; i < 4; i++) {
        lat += 0.0004; lng += 0.0002;
        await fetch(`${BASE}/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tripId, lat, lng, speed, heading })
        });
        await new Promise(r => setTimeout(r, 600));
      }

      if (scenario === 'deviation') {
        // Veer 90 deg off highway into bush at 10 km/h
        heading = 118; speed = 10;
        lat -= 0.0013; lng += 0.0028;
        await fetch(`${BASE}/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tripId, lat, lng, speed, heading })
        });
        await new Promise(r => setTimeout(r, 700));

        lat -= 0.0005; lng += 0.0012;
        await fetch(`${BASE}/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tripId, lat, lng, speed, heading })
        });
        toast('Bush Deviation detected! Generating Gemma AI SitRep...');
      } else if (scenario === 'manual') {
        await fetch(`${BASE}/alert`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tripId, lat, lng })
        });
        toast('Silent 911= Panic Alert triggered!');
      } else if (scenario === 'deadman') {
        toast('Heartbeats stopped. Watchdog dead-man switch will alarm shortly.');
      }
    } catch (err) {
      toast(`Sim error: ${err.message}`, true);
    }
  };

  /* ---------- Startup ---------- */
  fetch(`${BASE}/trips`).then((r) => r.ok ? r.json() : []).then((rows) => rows.forEach((t) => ensureTrip(t.id))).catch(() => {})
  .then(() => fetch(`${BASE}/incidents`)).then((r) => r.json()).then((rows) => {
    rows.forEach((r) => mergeIncident({ ...r, tripId: r.trip_id, sitrep: r.sitrep }, false));
    const pending = [...incidents.values()].find((i) => i.status === 'PENDING_CONFIRM');
    if (pending) select(pending.id);
  }).catch(() => {}).finally(() => { renderLedger(); connect(); });

  setInterval(() => {
    renderLedger();
    if (selected !== null && incidents.get(selected)) {
      const m = document.querySelector('.sheet-meta');
      const i = incidents.get(selected);
      if (m) m.textContent = `Trip ${i.tripId}, ${ago(i.created_at)}`;
    }
  }, 5000);

  renderLedger();
})();
</script>
</body>
</html>
